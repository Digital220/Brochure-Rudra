<body style="background-color: #ccc;"> <!-- Added background color to see book edges -->

<div class="flipbook-viewport">
	<div class="container">
		<div class="flipbook">
			<div style="background-image:url(pages/1.jpg)"></div>
			<div style="background-image:url(pages/2.jpg)"></div>

			<div style="background-image:url(pages/11.jpg)"></div>
			<div style="background-image:url(pages/12.jpg)"></div>
		</div>
	</div>
</div>

<script type="text/javascript">

function loadApp() {
    var originalPageWidth = 1360;
    var originalPageHeight = 1920;
    var originalTotalWidth = originalPageWidth * 2;

    var windowWidth = $(window).width() * 0.9;
    var windowHeight = $(window).height() * 0.9;

    var scale = Math.min(windowWidth / originalTotalWidth, windowHeight / originalPageHeight);

    var finalWidth = originalTotalWidth * scale;
    var finalHeight = originalPageHeight * scale;

    $('.flipbook').turn({
        width: finalWidth,
        height: finalHeight,
        elevation: 50,
        gradients: true,
        autoCenter: true // This handles the shift between single-page and double-page views
    });
}

yepnope({
    test : Modernizr.csstransforms,
    yep: ['lib/turn.js'],
    nope: ['lib/turn.html4.min.js'],
    both: ['css/basic.css'],
    complete: loadApp
});

</script>




</body>
</html>
